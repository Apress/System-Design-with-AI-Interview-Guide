    - idempotency_store_errors
    - out_of_order_event_rate
    - consumer_restarts_mid_flight
observability:
  signals:
    - replay_coverage
    - correlation_chain_breaks
    - missing_schema_version
    - missing_policy_version
cost:
  signals:
    - retry_storm_rate
    - dlq_triage_hours
